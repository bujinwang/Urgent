# ============================================================
# 急救侠 — 生产部署（Production）
# ============================================================
# 与本地开发形态 docker-compose.yml **互相独立**：
#   - 本地开发：docker-compose.yml（build 本地构建，server 暴露 3001、web 暴露 8080）
#   - 生产部署：本文件（全部使用 GHCR 镜像，仅 caddy 对外暴露 80/443）
#
# 上机使用方式（详见 docs/DEPLOY.md）：
#   cp .env.example .env      # 填 DOMAIN / TLS_EMAIL / JWT_SECRET / GOV_JWT_SECRET / CORS_ORIGINS
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
#
# ⚠️ 变量替换（${DOMAIN} 等）来自**本目录**的 .env；server 运行时变量同样取该文件。
# ============================================================

services:
  # ---------- TLS 终止 + 反向代理（唯一对外暴露端口的服务）----------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"          # HTTP：ACME HTTP-01 质询 + 自动跳转 HTTPS
      - "443:443"        # HTTPS
      - "443:443/udp"    # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书/私钥持久化：**必须**，否则每次重启重新签发会撞 Let's Encrypt 速率限制
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 后端 API（仅内网可达，不暴露宿主端口）----------
  server:
    image: ghcr.io/bujinwang/jiujiaxia-server:latest
    expose:
      - "3001"
    volumes:
      # 持久化 SQLite 数据（DB_PATH=./data/jiujiaxia.db）
      - server-data:/app/data
    env_file:
      # 与 compose 同目录的根级 .env（**不是** 急救侠-server/.env）
      - ./.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------- 前端静态站 + 内网 API 代理（仅内网可达）----------
  web:
    image: ghcr.io/bujinwang/jiujiaxia-web:latest
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  server-data:
  caddy-data:
  caddy-config:
