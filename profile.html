<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 - 应急救援协同系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-btn">返回</a>
            <h1 class="title">个人中心</h1>
        </header>

        <main class="main">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar">👤</div>
                    <h2>应急志愿者</h2>
                    <p class="certified">认证通过 ✓</p>
                </div>

                <div class="profile-section">
                    <h3>培训机构</h3>
                    <p>中国红十字会</p>
                </div>

                <div class="profile-section">
                    <h3>技能专长</h3>
                    <div class="skills">
                        <span class="skill-tag">CPR</span>
                        <span class="skill-tag">AED</span>
                    </div>
                </div>

                <div class="profile-section">
                    <h3>参与记录</h3>
                    <p class="record-count">参与：5次</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <a href="index.html">返回首页</a>
        </footer>
    </div>
