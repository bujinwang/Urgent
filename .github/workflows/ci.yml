# ============================================================
# 急救侠 — CI Pipeline
# ============================================================
# 每次 push / PR 到 main 时运行：
#   1. 后端 type-check + test
#   2. 前端 type-check + test
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — type-check + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./急救侠-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./急救侠-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test
        env:
          DB_PATH: ':memory:'

  uniapp:
    name: Uniapp — type-check + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./急救侠-uniapp

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./急救侠-uniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 拦下「Vue 分裂」这一静默失败：uni-app 精确锁 vue@3.4.21，而 pinia 的 peer 要求
      # vue@^3.5.11（二者不可兼得）。一旦有人移除 .npmrc 的 legacy-peer-deps 并重新生成
      # lock，`npm ci` 会「绿着」装出多份 Vue（应用与 uni-app 运行时各一套，运行时错配）。
      # 详见 急救侠-uniapp/.npmrc 与 scripts/check-vue-singleton.mjs。
      - name: Assert single Vue copy
        run: npm run check:vue-singleton

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test
