<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>急救侠 · 资质验证</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAFAF7;color:#1A1A1A;min-height:100vh}
.loading{text-align:center;padding:120px 20px;color:#8E8E8E}
.error{text-align:center;padding:120px 20px}
.error h2{font-size:20px;color:#EF4444}.error p{color:#8E8E8E;margin-top:8px;font-size:14px}
.verify{max-width:420px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;padding:40px 0 20px}
.avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-family:serif;font-size:40px;font-weight:700;color:#fff}
.avatar.gold{background:linear-gradient(135deg,#D4A017,#8B6914)}
.avatar.silver{background:linear-gradient(135deg,#8BA3B5,#5A6B78)}
.avatar.bronze{background:linear-gradient(135deg,#B87333,#8B5220)}
.avatar.diamond{background:linear-gradient(135deg,#4A90E2,#2563EB)}
.tier{display:inline-block;padding:6px 20px;border-radius:20px;font-size:16px;font-weight:700;color:#fff;margin-bottom:8px}
.tier.gold{background:#D4A017}.tier.silver{background:#8BA3B5}.tier.bronze{background:#B87333}.tier.diamond{background:#4A90E2}
.city{font-size:14px;color:#8E8E8E;margin-top:4px}
.stats{display:flex;gap:20px;justify-content:center;padding:24px 0}
.stat{text-align:center}.stat .n{font-size:32px;font-weight:700;font-family:'SF Mono',Menlo,monospace}.stat .l{font-size:11px;color:#8E8E8E;margin-top:2px}
.section{margin-bottom:16px}
.section-title{font-size:14px;font-weight:700;color:#8E8E8E;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:6px 14px;border-radius:14px;font-size:12px;font-weight:600}
.badge.gold{background:#FEF3C7;color:#92400E}.badge.blue{background:#EBF5FB;color:#2C5282}.badge.green{background:#D1FAE5;color:#065F46}
.cert-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border:1px solid #E5E5E0;border-radius:12px;margin-bottom:8px}
.cert-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cert-body{flex:1}.cert-type{font-size:14px;font-weight:600}.cert-issuer{font-size:11px;color:#8E8E8E}
.cert-expiry{font-size:11px;font-family:'SF Mono',Menlo,monospace;color:#8E8E8E}
.footer{text-align:center;padding:30px 0;border-top:1px solid #E5E5E0;margin-top:20px}
.footer p{font-size:12px;color:#8E8E8E;margin-bottom:12px}
.btn{display:inline-block;padding:12px 28px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:#C0392B;color:#fff}
.btn-ghost{background:transparent;color:#C0392B;border:1px solid #C0392B}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:16px;padding:28px;width:90%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,0.15)}
.modal h3{font-size:17px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#8E8E8E;margin-bottom:5px}
.modal input,.modal textarea{width:100%;padding:10px 12px;border:1px solid #E5E5E0;border-radius:8px;font-size:13px;margin-bottom:14px;font-family:inherit}
.modal textarea{resize:vertical;min-height:60px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#34D277;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;font-weight:600;z-index:200}
</style>
</head>
<body>
<div id="app">
<div v-if="loading" class="loading">验证中...</div>
<div v-else-if="errorMsg" class="error"><h2>验证失败</h2><p>{{errorMsg}}</p></div>
<template v-else-if="data">
<div class="verify">
<div class="hero">
  <div class="avatar" :class="data.tier">{{data.avatar}}</div>
  <div class="tier" :class="data.tier">{{data.tierLabel}}</div>
  <div class="city">{{data.city}}</div>
</div>
<div class="stats">
  <div class="stat"><div class="n">{{data.rescueCount}}</div><div class="l">参与救援</div></div>
  <div class="stat"><div class="n">{{data.certifications.length}}</div><div class="l">持有证书</div></div>
  <div class="stat"><div class="n">{{data.badges.length}}</div><div class="l">徽章</div></div>
</div>
<div class="section" v-if="data.badges.length">
  <div class="section-title">徽章</div>
  <div class="badges">
    <span v-for="b in data.badges" :key="b" class="badge" :class="badgeClass(b)">{{b}}</span>
  </div>
</div>
<div class="section">
  <div class="section-title">急救资质</div>
  <div v-if="data.certifications.length">
    <div v-for="c in data.certifications" :key="c.type" class="cert-item">
      <div class="cert-dot" :style="{background:c.status==='active'?'#34D277':c.status==='expiring'?'#F59E0B':'#EF4444'}"></div>
      <div class="cert-body"><div class="cert-type">{{c.type}}</div><div class="cert-issuer">{{c.issuer}}</div></div>
      <div class="cert-expiry">至 {{c.expiryDate}}</div>
    </div>
  </div>
  <div v-else style="font-size:12px;color:#8E8E8E">暂无资质记录</div>
</div>
<div class="section" v-if="data.trainingRecords?.length">
  <div class="section-title">训练经历</div>
  <div v-for="t in data.trainingRecords" :key="t.date" class="cert-item">
    <div class="cert-dot" style="background:#10B981"></div>
    <div class="cert-body"><div class="cert-type">{{scenarioLabel(t.scenario)}}</div><div class="cert-issuer">{{t.organizer}} · {{t.notes}}</div></div>
    <div class="cert-expiry">{{t.date}}</div>
  </div>
</div>
<div class="section" v-if="data.trailExperience">
  <div class="section-title">徒步经历</div>
  <div class="stats">
    <div class="stat"><div class="n">{{data.trailExperience.totalDistance}}km</div><div class="l">总里程</div></div>
    <div class="stat"><div class="n">↑{{data.trailExperience.totalElevation}}m</div><div class="l">总爬升</div></div>
    <div class="stat"><div class="n">{{data.trailExperience.hikesCompleted}}次</div><div class="l">完成</div></div>
  </div>
  <div v-if="data.trailExperience.badge" class="badges"><span class="badge gold">{{data.trailExperience.badge}}</span></div>
</div>
<div class="section" v-if="data.externalCertifications?.length">
  <div class="section-title">外部认证</div>
  <div v-for="e in data.externalCertifications" :key="e.type" class="cert-item">
    <div class="cert-dot" style="background:#4A90E2"></div>
    <div class="cert-body"><div class="cert-type">{{e.type}}</div><div class="cert-issuer">{{e.issuer}} · {{e.certNumber}}</div></div>
  </div>
</div>
<div class="footer">
  <p>此资质由 急救侠 平台认证，数据实时更新</p>
  <button class="btn btn-primary" @click="showForm=true">📩 联系平台了解更多</button>
</div>
</div>
</template>

<div v-if="showForm" class="modal-overlay" @click.self="showForm=false">
<div class="modal"><h3>联系平台</h3>
  <label>您的称呼</label><input v-model="form.name" placeholder="选填">
  <label>联系电话</label><input v-model="form.phone" placeholder="选填">
  <label>咨询内容</label><textarea v-model="form.message" placeholder="请输入您想了解的内容"></textarea>
  <div class="modal-actions"><button class="btn btn-ghost" @click="showForm=false">取消</button><button class="btn btn-primary" @click="submitInquiry">提交</button></div>
</div>
</div>
<div v-if="toast" class="toast">{{toast}}</div>
</div>

<script>
const{createApp,ref,onMounted}=Vue
createApp({setup(){
const API='http://localhost:3001/api/public'
const code=new URLSearchParams(location.search).get('code')||''
const loading=ref(true),errorMsg=ref(''),data=ref(null)
const showForm=ref(false),toast=ref('')
const form=ref({name:'',phone:'',message:''})

onMounted(async()=>{
  if(!code){errorMsg.value='缺少验证码';loading.value=false;return}
  try{const r=await fetch(`${API}/verify/${code}`).then(r=>r.json());if(r.code!==0){errorMsg.value=r.message}else{data.value=r.data}}catch(e){errorMsg.value='网络错误，请重试'}finally{loading.value=false}
})

async function submitInquiry(){
  if(!form.value.message){toast.value='请填写咨询内容';setTimeout(()=>toast.value='',2000);return}
  await fetch(`${API}/inquire`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...form.value,targetPublicId:code})})
  showForm.value=false;form.value={name:'',phone:'',message:''}
  toast.value='已提交，平台将尽快联系您';setTimeout(()=>toast.value='',3000)
}

function badgeClass(b){return b.includes('金牌')||b.includes('资深')?'gold':b.includes('救援')?'green':'blue'}
function scenarioLabel(s){return{cpr:'CPR 心肺复苏',aed:'AED 使用',trauma:'创伤急救',choking:'异物窒息',mass:'群体伤'}[s]||s}
return{loading,errorMsg,data,showForm,toast,form,submitInquiry,badgeClass,scenarioLabel}
}}).mount('#app')
</script>
</body>
</html>
