<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC - 应急救援协同系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-btn">返回</a>
            <h1 class="title">NFC志愿者</h1>
        </header>

        <main class="main">
            <div class="nfc-card">
                <div class="nfc-icon">📱</div>
                <h2>已认证志愿者</h2>
                <p class="nfc-status">当前可参与任务</p>
                <div class="nfc-info">
                    <p>身份已验证</p>
                    <p>技能：CPR/AED</p>
                </div>
            </div>

            <div class="button-group">
                <a href="index.html" class="btn btn-primary">发起协助请求</a>
            </div>
        </main>

        <footer class="footer">
            <a href="index.html">返回首页</a>
        </footer>
    </div>
</body>
</html>
